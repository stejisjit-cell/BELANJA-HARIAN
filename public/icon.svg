<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9F5"/>
      <stop offset="100%" stop-color="#FDF1E9"/>
    </linearGradient>
    <linearGradient id="peachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8E2DC"/>
      <stop offset="100%" stop-color="#F3D7D1"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAAFA8"/>
      <stop offset="100%" stop-color="#DDA29B"/>
    </linearGradient>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8BCAB"/>
      <stop offset="100%" stop-color="#A7AB98"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2"/>
      <stop offset="100%" stop-color="#EFD7A8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#55443B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#EFE6DD" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Main Wallet / Ledger Container -->
  <g filter="url(#shadow)">
    <!-- Ledger Base / Book Body -->
    <rect x="136" y="116" width="240" height="280" rx="28" fill="url(#pinkGrad)"/>
    
    <!-- Ledger Inner Spine / Accent band -->
    <rect x="136" y="116" width="46" height="280" rx="28" fill="#55443B" fill-opacity="0.15"/>
    
    <!-- Spine binding stitches -->
    <line x1="159" y1="140" x2="159" y2="160" stroke="#FFF9F5" stroke-width="4" stroke-linecap="round"/>
    <line x1="159" y1="180" x2="159" y2="200" stroke="#FFF9F5" stroke-width="4" stroke-linecap="round"/>
    <line x1="159" y1="220" x2="159" y2="240" stroke="#FFF9F5" stroke-width="4" stroke-linecap="round"/>
    <line x1="159" y1="260" x2="159" y2="280" stroke="#FFF9F5" stroke-width="4" stroke-linecap="round"/>
    <line x1="159" y1="300" x2="159" y2="320" stroke="#FFF9F5" stroke-width="4" stroke-linecap="round"/>
    <line x1="159" y1="340" x2="159" y2="360" stroke="#FFF9F5" stroke-width="4" stroke-linecap="round"/>

    <!-- Front Pocket / Card Holder -->
    <rect x="176" y="180" width="180" height="196" rx="20" fill="#FFF9F5"/>

    <!-- Small Budget Lines on Pocket -->
    <rect x="198" y="212" width="90" height="12" rx="6" fill="url(#peachGrad)"/>
    <rect x="198" y="234" width="136" height="8" rx="4" fill="#E8DEC8"/>
    <rect x="198" y="250" width="112" height="8" rx="4" fill="#E8DEC8"/>

    <!-- Gold Coin / Rupiah Medallion -->
    <g transform="translate(256, 310)">
      <circle cx="0" cy="0" r="38" fill="url(#goldGrad)" stroke="#E0C692" stroke-width="3"/>
      <!-- Coin Rim -->
      <circle cx="0" cy="0" r="31" fill="none" stroke="#FAF1DC" stroke-width="2"/>
      <!-- Rp Symbol or Heart Flower -->
      <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#55443B" text-anchor="middle">Rp</text>
    </g>
  </g>

  <!-- Sage Botanical Branch (Left bottom) -->
  <g fill="none" stroke="url(#sageGrad)" stroke-width="4" stroke-linecap="round">
    <path d="M96 380 Q120 370 144 386"/>
    <!-- Leaves -->
    <ellipse cx="114" cy="368" rx="10" ry="6" transform="rotate(-35 114 368)" fill="url(#sageGrad)"/>
    <ellipse cx="134" cy="378" rx="10" ry="6" transform="rotate(25 134 378)" fill="url(#sageGrad)"/>
  </g>

  <!-- Sage Botanical Branch (Right top) -->
  <g fill="none" stroke="url(#sageGrad)" stroke-width="4" stroke-linecap="round">
    <path d="M370 126 Q400 110 420 134"/>
    <!-- Leaves -->
    <ellipse cx="388" cy="116" rx="9" ry="5" transform="rotate(30 388 116)" fill="url(#sageGrad)"/>
    <ellipse cx="406" cy="124" rx="9" ry="5" transform="rotate(-20 406 124)" fill="url(#sageGrad)"/>
  </g>
</svg>
